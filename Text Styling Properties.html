<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SuperHero Card</title>
    <style>
        body {
            background-color: Darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        .heroname {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }

        .tagline {
            font-size: 30px;
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        .label {
           text-transform: uppercase;
           text-decoration: underline;
            color: coral;
        }

        .power {
            font-weight: bold;
            color: lightgreen;
        }

        .weakness {
            text-decoration: line-through;
            color: grey;
        }

        .badge {
            font-weight: bold;
            font-size: 28px;
            color: gold;
            transform: rotate(15deg);
        }
    </style>
</head>
<body>
    <h1 class="heroname">Thunder Kid</h1>
    <p class="tagline">The Most Powerful Hero in the School</p>

    <h2 class="label">Superpowers</h2>
    <p class="power">Can run faster than a cheetah.</p>
    <p class="power">Can lift a car with one hand.</p>

    <h2 class="label">Weaknesses</h2>
    <p class="weakness">Afraid of heights.</p>
    <p class="badge">Top Hero</p>
</body>
</html>
